<!DOCTYPE html>
<html lang="no">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>JP Sandbox</title>
  <style>
    :root {
      --bg: #0f0f14;
      --fg: #f4f4f5;
      --accent: #6366f1;
      --muted: #a1a1aa;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--fg);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 2rem;
      overflow: hidden;
    }
    .wrap {
      max-width: 600px;
      animation: fadeup 0.9s ease-out;
    }
    @keyframes fadeup {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .badge {
      display: inline-block;
      font-size: 0.8rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--accent);
      border: 1px solid var(--accent);
      border-radius: 999px;
      padding: 0.4rem 1rem;
      margin-bottom: 1.5rem;
    }
    h1 {
      font-size: clamp(2.5rem, 8vw, 4.5rem);
      line-height: 1.05;
      margin-bottom: 1rem;
      letter-spacing: -0.03em;
    }
    .accent { color: var(--accent); }
    p {
      color: var(--muted);
      font-size: 1.15rem;
      line-height: 1.6;
    }
    .dot {
      display: inline-block;
      width: 10px;
      height: 10px;
      background: #22c55e;
      border-radius: 50%;
      margin-right: 0.5rem;
      box-shadow: 0 0 0 0 rgba(34, 197, 94, 0.6);
      animation: pulse 2s infinite;
    }
    @keyframes pulse {
      0% { box-shadow: 0 0 0 0 rgba(34, 197, 94, 0.6); }
      70% { box-shadow: 0 0 0 12px rgba(34, 197, 94, 0); }
      100% { box-shadow: 0 0 0 0 rgba(34, 197, 94, 0); }
    }
    .status {
      margin-top: 2.5rem;
      font-size: 0.95rem;
      color: var(--muted);
    }
  </style>
</head>
<body>
  <div class="wrap">
    <span class="badge">Sandbox</span>
    <h1>Det <span class="accent">funker</span>.</h1>
    <p>Hvis du ser denne siden på en .vercel.app-adresse, er hele kjeden oppe og går: GitHub lagrer koden, Vercel publiserer den, og verden kan se den.</p>
    <p class="status"><span class="dot"></span>Live og klar for prosjekter</p>
  </div>
</body>
</html>
